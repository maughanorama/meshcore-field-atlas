name: Source checks
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q server.py tools
      - run: node --check static/app.js
      - run: node --test tests/field-tools.cjs
